name: sheng macOS lab

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: UniXNU core branch or commit
        type: string
        default: main
      root_storage:
        description: Build the userdata root image
        type: boolean
        default: true
      export_build_inputs:
        description: Export cached XNU objects and the SDK for a local build
        type: boolean
        default: false
      kernel_cache_key:
        description: Kernel cache to export
        type: string
        default: sheng-macos27-kernel-v1-d509f7e4757a27f5-43684813634

permissions:
  contents: read

concurrency:
  group: macos-lab-${{ github.ref }}-${{ inputs.export_build_inputs && 'inputs' || 'images' }}
  cancel-in-progress: false

jobs:
  local-inputs:
    if: inputs.export_build_inputs
    uses: ./.github/workflows/export-kernel-cache.yml
    with:
      cache_key: ${{ inputs.kernel_cache_key }}
  images:
    if: ${{ !inputs.export_build_inputs }}
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      UNIXNU_IPSW_JOBS: 16
      HOMEBREW_NO_AUTO_UPDATE: 1
      GITHUB_TOKEN: ${{ github.token }}
      UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
      UNIXNU_LAB_PASSWORD: ${{ secrets.UNIXNU_LAB_PASSWORD }}
      UNIXNU_EXTRA_USERS: ${{ secrets.UNIXNU_EXTRA_USERS }}
    steps:
      - name: Check out device sources
        uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - name: Check out core sources
        uses: actions/checkout@v4
        with:
          repository: zus12873/UniXNU
          ref: cf924b27d6d17e171800436251287d01948fb9c7
          path: UniXNU
          submodules: false
      - name: Check out core submodules (three of them from the zus12873 forks)
        working-directory: UniXNU
        run: |
          set -e
          git submodule init
          git config submodule.drivers/AdrenoMetal.url https://github.com/zus12873/AdrenoMetal.git
          git config submodule.drivers/DarwinBoot.url https://github.com/zus12873/DarwinBoot.git
          git submodule update --recursive
          # AdrenoMetal: zus12873 fix/iosurface-row-alignment (official main 2026-11-25: metal2vulkan fork, zero-copy host imports, YCbCr via compute; + 16-byte IOSurface rows)
          git -C drivers/AdrenoMetal fetch https://github.com/zus12873/AdrenoMetal e0d8c3c90323e7f52f6464d585a1d4d401bbd300
          git -C drivers/AdrenoMetal checkout --detach FETCH_HEAD
          # DarwinBoot: zus12873 local/window-9g (the official pin 5243c68 plus the 9 GiB window, the 12 GB layout)
          git -C drivers/DarwinBoot fetch https://github.com/zus12873/DarwinBoot bdb6ff7119780083ada9683cc34d54fbd3c8c9cb
          git -C drivers/DarwinBoot checkout --detach bdb6ff7119780083ada9683cc34d54fbd3c8c9cb
          # Record both pins in the core index: unixnu's update_submodules runs `git submodule update`, which would put the
          # core's own pins back (official DarwinBoot 5243c68 refuses the 9 GiB window: "boot refused: Compromised Data").
          git add drivers/DarwinBoot drivers/AdrenoMetal
          git submodule status
      - name: ArmCpu starts only the first armcpu-cpus=N cores (default all)
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('UniXNU/drivers/ArmCpu/ArmCpu.cpp'); s = p.read_text()
          a = "    if (smp == 0 || ml_get_cpu_number (id) < 0 || ml_get_cpu_number (id) >= ARMCPU_SMP_SLOTS) {\n"
          assert s.count(a) == 1, 'ArmCpu probe line not found'
          b = ("    unsigned limit = ARMCPU_SMP_SLOTS;\n"
               "    PE_parse_boot_argn (\"armcpu-cpus\", &limit, sizeof (limit));\n"
               "    if (smp == 0 || ml_get_cpu_number (id) < 0 || ml_get_cpu_number (id) >= ARMCPU_SMP_SLOTS ||\n"
               "        ml_get_cpu_number (id) >= (int) limit) {\n")
          p.write_text(s.replace(a, b, 1)); print('armcpu-cpus added')
          PY
      - name: Check out firmware sources
        uses: actions/checkout@v4
        with:
          repository: zus12873/uefi-sheng
          ref: 20331338c045db384b938b57e0a62de23fec73d5
          path: uefi-sheng
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Restore build inputs
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          key: sheng-macos27-build-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: sheng-macos27-build-v1-${{ runner.os }}-
          path: |
            UniXNU/out/feeds
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/gpu-reference
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/mesa-work
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/adreno-metal-bridge
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/m2v-target
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/mesa-tu-macos27
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/runtime/data.dbr
            device/drivers/Ath12kWifi/deps
            device/.cache/firmware
      - name: Restore the 12 GB window options in the newer core's device tree generator (zus12873's local core had them)
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('UniXNU/scripts/unixnu/devicetree.py'); s = p.read_text()
          a = "        if not 0x10000000 <= size <= 0x200000000 or size % 0x200000:\n            raise Error('Owned memory must be 256 MiB to 8 GiB in 2 MiB steps')\n"
          assert s.count(a) == 1, 'owned memory check not found'
          s = s.replace(a, "        if not 0x10000000 <= size <= 0x240000000 or size % 0x200000:\n            raise Error('Owned memory must be 256 MiB to 9 GiB in 2 MiB steps')\n")
          b = "        chosen.append(('darwinboot-memory-excluded', bytes(16 * slots)))\n"
          assert s.count(b) == 1, 'excluded-range table not found'
          s = s.replace(b, b + "    if options.get('owned_memory_floor') is not None:\n        floor = int(str(options['owned_memory_floor']), 0)\n        if not 0 < floor < 1 << 64 or floor % 0x200000 or not options.get('owned_memory_size') or not options.get('owned_memory_excluded_ranges'):\n            raise Error('Owned memory floor: a nonzero 2 MiB-aligned address with owned_memory_size and owned_memory_excluded_ranges')\n        chosen.append(('darwinboot-memory-floor', struct.pack('<Q', floor)))\n")
          p.write_text(s)
          print('9 GiB window and floor restored')
          PY
      - name: Drop the cached Mesa tree (built for the older core's patch sequence)
        run: |
          rm -rf UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/mesa-work UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/mesa-tu-macos27
      - name: Refresh pinned translator checkout
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, shutil, subprocess
          from pathlib import Path
          core = Path('UniXNU')
          pin = json.loads((core / 'scripts/data/gpu-metal-vulkan-inputs.json').read_text())['translator']['commit']
          source = core / 'out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/gpu-reference/metal2vulkan'
          signature = hashlib.sha256((pin + '\n').encode() + (core / 'scripts/build-adreno-metal-bridge.py').read_bytes() + b''.join(path.read_bytes() for path in sorted((core / 'drivers/AdrenoMetal/bridge/patches').glob('*.patch')))).hexdigest()
          stamp = source.with_name('unixnu-translator-patch.sha256')
          if source.exists():
              actual = subprocess.check_output(['git', '-C', str(source), 'rev-parse', 'HEAD'], text=True).strip()
              if actual != pin or not stamp.exists() or stamp.read_text().strip() != signature:
                  shutil.rmtree(source)
          stamp.parent.mkdir(parents=True, exist_ok=True)
          stamp.write_text(signature + '\n')
          PYTHON
      - name: Install build tools
        run: |
          brew install dtc llvm lld llvm@22 lld@22 cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup unifdef openssl@3 zstd blacktop/tap/ipsw
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          python3 - <<'PYTHON'
          from pathlib import Path
          toolchain = Path('uefi-toolchain').resolve()
          toolchain.mkdir()
          for name in ('clang', 'llvm-lib', 'llvm-rc', 'lld-link'):
              package = 'lld@22' if name == 'lld-link' else 'llvm@22'
              (toolchain / name).symlink_to(Path('/opt/homebrew/opt') / package / 'bin' / name)
          with Path(__import__('os').environ['GITHUB_ENV']).open('a') as output:
              output.write('CLANG_BIN=' + str(toolchain) + '/\n')
          PYTHON
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Identify kernel SDK cache
        id: kernel-sdk
        run: |
          python3 - <<'PYTHON'
          import hashlib, os, subprocess
          from pathlib import Path
          version = subprocess.check_output(['xcodebuild', '-version']) + subprocess.check_output(['xcrun', '--sdk', 'iphoneos', '--show-sdk-version'])
          key = 'sheng-macos27-kernel-v1-' + hashlib.sha256(version).hexdigest()[:16]
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('key=' + key + '\n')
          PYTHON
      - name: Restore kernel compile records
        id: kernel-cache
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.kernel-sdk.outputs.key }}-${{ github.run_id }}
          restore-keys: ${{ steps.kernel-sdk.outputs.key }}-
          path: |
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/xnu-inputs.json
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/xnu-work
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/fakeroot
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/xnu
      - name: Extra administrator accounts from UNIXNU_EXTRA_USERS
        run: |
          # One "name:password" per line in the secret; each becomes an admin (uid 502, 503, ...). The list goes to a root-only
          # file that the seed script (run through sudo, which drops the environment) reads and deletes.
          umask 077
          printf '%s\n' "$UNIXNU_EXTRA_USERS" > "$RUNNER_TEMP/extra-users"
          sudo install -m 600 -o root "$RUNNER_TEMP/extra-users" /var/root/unixnu-extra-users
          rm -f "$RUNNER_TEMP/extra-users"
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('UniXNU/scripts/make-macos-data-seed.py'); s = p.read_text()
          extra = """
          def extra_users():
              path = Path('/var/root/unixnu-extra-users')
              if not path.is_file():
                  return []
              users = []
              for line in path.read_text().splitlines():
                  line = line.strip()
                  if not line or ':' not in line:
                      continue
                  name, password = line.split(':', 1)
                  if not name.isidentifier() and not name.replace('-', '').replace('.', '').isalnum():
                      raise SystemExit('bad extra user name')
                  users.append((name.lower(), password, name))
              path.unlink()
              return users
          """
          import textwrap
          s = s.replace('\ndef build(parser, args, os_mount):', textwrap.dedent(extra) + '\n\ndef build(parser, args, os_mount):', 1)
          a = "                add_user(scratch / DSLOCAL, *args.user.split(':', 1), real_name=args.real_name)\n"
          assert a in s
          s = s.replace(a, a + "            extras = extra_users()\n            for i, (n, pw, real) in enumerate(extras):\n                add_user(scratch / DSLOCAL, n, pw, uid=502 + i, real_name=real)\n", 1)
          b = "                add_home(template, scratch, args.user.split(':', 1)[0])\n"
          assert b in s
          s = s.replace(b, b + "            for i, (n, pw, real) in enumerate(extras):\n                add_home(template, scratch, n, uid=502 + i)\n", 1)
          p.write_text(s)
          print('extra-user support added')
          PY
      - name: Prepare installation
        working-directory: UniXNU
        run: |
          ./unixnu defconfig sheng_macos_defconfig -D ../device --os macos-27
          ./unixnu fetch --os macos-27
          if [ '${{ inputs.root_storage }}' = true ]; then
            python3 ../device/scripts/prepare-macos-install.py
          else
            python3 ../device/scripts/prepare-macos-install.py --reuse-policies
          fi
      - name: Build images
        id: build-images
        working-directory: device
        run: scripts/package.sh --os macos-27 --uefi ../uefi-sheng
      - name: Publish shader inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shader-inventory
          path: |
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/prime-list.txt
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/prime-list.json
          retention-days: 1
      - name: Build root storage
        if: inputs.root_storage
        working-directory: UniXNU
        run: |
          python3 - <<'PY'
          import subprocess, sys
          sys.path.insert(0, 'scripts')
          from unixnu.cli import parser
          from unixnu.config import Context
          ctx = Context(parser().parse_args(['build', 'userdata', '-D', '../device', '--os', 'macos-27']))
          objects = []
          for window in ctx.board['userdata']['windows']:
              name = window['name']
              objects += ['--object', f'{name}.vroot={ctx.tree}/build/verified-root-{name}/hashes.bin']
          subprocess.run(['./unixnu', 'build', 'userdata', '--os', 'macos-27', *objects], check=True)
          PY
      - name: Stage device artifacts
        env:
          BUILD_ROOT_STORAGE: ${{ inputs.root_storage }}
        run: |
          mkdir artifacts
          target=UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos
          cp "$target/boot/boot.img" "$target/payload/payload.img" "$target/kernel/kernel.macho" "$target/package.manifest.json" artifacts/
          cp "$target/tree/build/prime-list.txt" "$target/tree/build/prime-list.json" artifacts/
          if [ "$BUILD_ROOT_STORAGE" = true ]; then
            cp "$target/userdata/userdata-root.json" artifacts/
            zstd -T0 -3 --sparse "$target/userdata/userdata-root.img" -o artifacts/userdata-root.img.zst
          fi
      - name: Publish the boot image alone
        uses: actions/upload-artifact@v4
        with:
          name: sheng-boot
          path: |
            artifacts/boot.img
            artifacts/package.manifest.json
            artifacts/userdata-root.json
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: sheng-macos-27
          path: artifacts/
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            UniXNU/out/sheng/*/*/logs/*.log
            UniXNU/out/sheng/*/*/tree/build/adreno-metal-bridge/build-*.log
            UniXNU/out/sheng/*/*/tree/build/prime-list.*
            UniXNU/out/sheng/*/*/tree/build/sheng-source-storage/*.log
            UniXNU/out/sheng/*/*/tree/build/sheng-source-storage/*.command.json
          retention-days: 1
      - name: Save build inputs
        if: always() && steps.build-images.outcome == 'success' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: sheng-macos27-build-v1-${{ runner.os }}-${{ github.run_id }}
          path: |
            UniXNU/out/feeds
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/gpu-reference
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/mesa-work
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/adreno-metal-bridge
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/m2v-target
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/mesa-tu-macos27
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/runtime/data.dbr
            device/drivers/Ath12kWifi/deps
            device/.cache/firmware
      - name: Save kernel compile records
        if: always() && steps.build-images.outcome == 'success' && steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.kernel-sdk.outputs.key }}-${{ github.run_id }}
          path: |
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/xnu-inputs.json
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/xnu-work
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/fakeroot
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/xnu
